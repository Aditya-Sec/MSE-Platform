<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <style>.mono{font-family:'SFMono-Regular',Consolas,Menlo,monospace;}</style>
    <linearGradient id="vgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1012"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="50">
        <animate attributeName="width" values="0;480;480;480" keyTimes="0;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="220" rx="12" fill="url(#vgrad)"/>
  <g stroke="#151a1d" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
  </g>

  <rect x="0" y="0" width="1200" height="34" fill="#111417" rx="12"/>
  <rect x="0" y="22" width="1200" height="12" fill="#111417"/>
  <circle cx="24" cy="17" r="6" fill="#3a3f44"/>
  <circle cx="46" cy="17" r="6" fill="#3a3f44"/>
  <circle cx="68" cy="17" r="6" fill="#3a3f44"/>
  <text x="600" y="22" text-anchor="middle" class="mono" font-size="13" fill="#5a6169">mse-platform — bicep build --stdout — 120x24</text>

  <g clip-path="url(#reveal)">
    <text x="40" y="90" class="mono" font-size="28" font-weight="600" fill="#eef2f4">Microsoft Secure Enterprise Platform</text>
  </g>

  <text x="40" y="130" class="mono" font-size="16" fill="#9aa3ab">8 architecture layers · real, compiled Bicep · Entra ID → Defender XDR → Sentinel → Copilot</text>

  <text x="40" y="165" class="mono" font-size="20" fill="#4dd4e8">$</text>
  <rect x="58" y="147" width="12" height="22" fill="#4dd4e8">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>.mono{font-family:'SFMono-Regular',Consolas,Menlo,monospace;}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4dd4e8"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#0a0d10"/>
  <text x="20" y="30" class="mono" font-size="16" fill="#4dd4e8">MSE Platform — High-Level Design</text>

  <!-- Internet edge -->
  <rect x="450" y="55" width="300" height="45" rx="8" fill="#0d1012" stroke="#4dd4e8" stroke-width="1.5"/>
  <text x="600" y="83" text-anchor="middle" class="mono" font-size="13" fill="#4dd4e8">Internet</text>
  <line x1="600" y1="100" x2="600" y2="125" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Edge layer -->
  <rect x="300" y="130" width="600" height="60" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="600" y="155" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Azure Front Door (CDN + WAF + DDoS)  →  Application Gateway  →  Azure Firewall Premium</text>
  <text x="600" y="175" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">Layer 4 — Network &amp; Edge Security</text>
  <line x1="600" y1="190" x2="600" y2="215" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- VNet -->
  <rect x="150" y="220" width="900" height="110" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="600" y="245" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Azure Virtual Network</text>
  <text x="600" y="262" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">Layer 1 — Foundation (VNet, Subnets, NSGs, Key Vault, Bastion)</text>

  <rect x="180" y="278" width="260" height="42" rx="6" fill="#0d1012" stroke="#1c2226"/>
  <text x="310" y="303" text-anchor="middle" class="mono" font-size="11" fill="#9aa3ab">Windows Servers + Defender for Endpoint</text>

  <rect x="470" y="278" width="260" height="42" rx="6" fill="#0d1012" stroke="#1c2226"/>
  <text x="600" y="303" text-anchor="middle" class="mono" font-size="11" fill="#9aa3ab">Linux Servers + Defender for Endpoint</text>

  <rect x="760" y="278" width="260" height="42" rx="6" fill="#0d1012" stroke="#1c2226"/>
  <text x="890" y="303" text-anchor="middle" class="mono" font-size="11" fill="#9aa3ab">AKS + Defender for Containers</text>
  <text x="600" y="345" text-anchor="middle" class="mono" font-size="10" fill="#5a6169">Layer 2 — Endpoint Security</text>

  <line x1="600" y1="330" x2="600" y2="365" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Identity + Cloud row -->
  <rect x="150" y="370" width="420" height="70" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="360" y="397" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Entra ID + Conditional Access</text>
  <text x="360" y="415" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">Layer 3 — Identity Security (Defender for Identity)</text>

  <rect x="630" y="370" width="420" height="70" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="840" y="397" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Defender for Cloud (CSPM/CWPP)</text>
  <text x="840" y="415" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">Layer 5 — Cloud Security Posture</text>

  <line x1="360" y1="440" x2="360" y2="465" stroke="#4dd4e8" marker-end="url(#arrow)"/>
  <line x1="840" y1="440" x2="840" y2="465" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Email/CASB/Data row -->
  <rect x="150" y="470" width="900" height="60" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="600" y="495" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Defender for Office 365  •  Defender for Cloud Apps (CASB)  •  Microsoft Purview (DLP)</text>
  <text x="600" y="513" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">Layer 6 — Email, CASB &amp; Data Protection</text>

  <line x1="600" y1="530" x2="600" y2="555" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Monitor -->
  <rect x="300" y="560" width="600" height="55" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="600" y="592" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Azure Monitor → Log Analytics Workspace</text>

  <line x1="600" y1="615" x2="600" y2="640" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Sentinel -->
  <rect x="350" y="645" width="500" height="60" rx="8" fill="#0d1012" stroke="#4dd4e8" stroke-width="1.5"/>
  <text x="600" y="672" text-anchor="middle" class="mono" font-size="13" fill="#4dd4e8">Microsoft Sentinel (SIEM)</text>
  <text x="600" y="690" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">Layer 8 — Detection &amp; Correlation, ATT&amp;CK-mapped</text>

  <line x1="600" y1="705" x2="600" y2="730" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Logic Apps -->
  <rect x="350" y="735" width="500" height="55" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="600" y="767" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Logic Apps (SOAR Playbooks)</text>
  <text x="600" y="783" text-anchor="middle" class="mono" font-size="10" fill="#5a6169">Layer 9 — Automation &amp; Response</text>

  <line x1="600" y1="790" x2="600" y2="815" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Copilot -->
  <rect x="350" y="820" width="500" height="55" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="600" y="850" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Security Copilot Investigation</text>
  <text x="600" y="868" text-anchor="middle" class="mono" font-size="10" fill="#5a6169">Layer 7 — Threat Intel &amp; AI-Assisted Ops</text>
</svg>

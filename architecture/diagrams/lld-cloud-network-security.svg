<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <defs>
    <style>.mono{font-family:'SFMono-Regular',Consolas,Menlo,monospace;}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4dd4e8"/>
    </marker>
  </defs>
  <rect width="1100" height="480" fill="#0a0d10"/>
  <text x="20" y="30" class="mono" font-size="15" fill="#4dd4e8">Phase 4 — Cloud &amp; Network Security — Low-Level Design</text>
  <text x="20" y="50" class="mono" font-size="11" fill="#5a6169">Every box below maps to a real file in this repo — nothing here isn't in the code</text>

  <!-- Internet -->
  <rect x="470" y="70" width="160" height="45" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="550" y="98" text-anchor="middle" class="mono" font-size="12" fill="#eef2f4">Internet</text>
  <line x1="550" y1="115" x2="550" y2="145" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- Front Door + WAF -->
  <rect x="380" y="150" width="340" height="65" rx="8" fill="#0d1012" stroke="#4dd4e8" stroke-width="1.5"/>
  <text x="550" y="175" text-anchor="middle" class="mono" font-size="12" fill="#4dd4e8">Azure Front Door + WAF (Premium)</text>
  <text x="550" y="192" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">front-door-waf.bicep · OWASP ruleset · Prevention mode</text>
  <text x="550" y="207" text-anchor="middle" class="mono" font-size="9" fill="#5a6169">→ waf-sql-injection-burst.kql</text>
  <line x1="550" y1="215" x2="550" y2="245" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- DDoS annotation -->
  <rect x="760" y="150" width="220" height="65" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="870" y="175" text-anchor="middle" class="mono" font-size="11" fill="#eef2f4">DDoS Protection Plan</text>
  <text x="870" y="192" text-anchor="middle" class="mono" font-size="9" fill="#9aa3ab">ddos-protection.bicep</text>
  <text x="870" y="206" text-anchor="middle" class="mono" font-size="9" fill="#5a6169">protects Firewall + Front Door public IPs</text>

  <!-- Firewall -->
  <rect x="380" y="250" width="340" height="65" rx="8" fill="#0d1012" stroke="#4dd4e8" stroke-width="1.5"/>
  <text x="550" y="275" text-anchor="middle" class="mono" font-size="12" fill="#4dd4e8">Azure Firewall Premium</text>
  <text x="550" y="292" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">firewall-rules.bicep · policy + rule collections</text>
  <text x="550" y="307" text-anchor="middle" class="mono" font-size="9" fill="#5a6169">deployed into Phase 1's reserved AzureFirewallSubnet</text>
  <line x1="550" y1="315" x2="550" y2="345" stroke="#4dd4e8" marker-end="url(#arrow)"/>

  <!-- VNet workloads -->
  <rect x="60" y="350" width="980" height="60" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="80" y="373" class="mono" font-size="11" fill="#eef2f4">Phase 1 VNet — workload subnets (Windows/Linux/AKS)</text>
  <text x="80" y="390" class="mono" font-size="9" fill="#5a6169">→ storage-malware-upload.kql · aks-*.kql (already built in Phase 3, source layer here)</text>

  <!-- Bastion -->
  <rect x="60" y="150" width="260" height="65" rx="8" fill="#0d1012" stroke="#4dd4e8" stroke-width="1.5"/>
  <text x="190" y="175" text-anchor="middle" class="mono" font-size="12" fill="#4dd4e8">Azure Bastion</text>
  <text x="190" y="192" text-anchor="middle" class="mono" font-size="10" fill="#9aa3ab">bastion.bicep · Standard tier</text>
  <text x="190" y="206" text-anchor="middle" class="mono" font-size="9" fill="#5a6169">only path to RDP/SSH — NSGs enforce this</text>
  <line x1="190" y1="215" x2="190" y2="345" stroke="#4dd4e8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Defender for Cloud -->
  <rect x="60" y="425" width="980" height="45" rx="8" fill="#10151a" stroke="#1c2226"/>
  <text x="550" y="453" text-anchor="middle" class="mono" font-size="11" fill="#9aa3ab">Defender for Cloud — Storage, SQL, Containers, CSPM (defender-for-cloud.bicep, subscription-scoped, separate deployment)</text>
</svg>
